[Service]
# O default do manager era 1024:524288; o processo atingiu 1018 FDs após
# acumular drivers Playwright. O limite maior dá folga para ingestão paralela,
# enquanto TasksMax mantém uma barreira contra novo vazamento descontrolado.
LimitNOFILE=65535
TasksMax=4096
Environment=PJE_SESSION_IDLE_SECONDS=1800
