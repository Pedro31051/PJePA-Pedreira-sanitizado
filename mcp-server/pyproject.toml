[tool.ruff]
target-version = "py310"
extend-exclude = [".loop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"tests/*.py" = ["E402", "E741", "F841"]
"src/domain_analyzers/*.py" = ["F403"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: exige PJE_ENABLE_LIVE_TESTS=1 e ambiente real autorizado",
]
